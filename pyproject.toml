[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
mypy_path = ["tests", "tests/fixtures/public"]
files = [
    "image_to_bricks", "tools", "tests", "my_bricks_catalog", "model_to_bricks.py", "images_to_model.py",
    "images_to_bricks.py",
]
exclude = ["^notes/", "^private/", "^tests/fixtures/local/", "^\\.deps/", "^\\.models/"]
warn_unreachable = true
untyped_calls_exclude = ["trimesh"]  # trimesh ships partial annotations; its untyped helpers are called as-is

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["trimesh.*", "scipy.*", "pyrender.*", "reportlab.*", "fast_simplification.*", "rtree.*", "networkx.*", "tqdm.*", "skimage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests: test functions and their small helpers need no annotations (their bodies are still type-checked).
module = [
    "figure_shapes",
    "make_public_fixtures",
