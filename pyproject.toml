[tool.vulture]
# dead code: run `vulture` (no arguments) in the project folder; pre-commit runs it on the whole project, because a
# name used in another file is not dead. Tests are included, so helpers only tests use are not reported.
paths = [
    "image_to_bricks", "tools", "tests", "my_bricks_catalog", "model_to_bricks.py", "images_to_model.py",
    "images_to_bricks.py",
]
min_confidence = 60
# names a library reads, not our code: pyrender camera attribute, matplotlib keyword arguments in the
# outputs_handler.VoxelAxes protocol, check_cost.CostLine columns (written to the CSV by iterating the row), module
# attributes Python's import system reads (trellis_engine.register_package_without_init), the metadata protocol method
ignore_names = ["yfov", "edgecolor", "linewidth", "aspect", "unit_pln", "cost_pln", "__path__", "__spec__", "__getitem__"]
