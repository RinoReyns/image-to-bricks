[project]
name = "image-to-bricks"
description = "Turn pictures of a character, or a coloured 3D model (GLB), into a LEGO build with step-by-step instructions."
requires-python = ">=3.12"
license = "GPL-3.0-or-later"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["notes", "private", "tests/fixtures/local", ".deps", ".models"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes: unused names, undefined names
    "I",        # import order
    "N",        # pep8 names
    "UP",       # modern syntax for Python 3.10
    "B",        # likely bugs
    "SIM",      # simpler code
    "C4",       # comprehensions
    "RET",      # return statements
    "PL",       # pylint: too many arguments / branches / statements, magic values, global
    "C90",      # cyclomatic complexity
    "ANN",      # type annotations on every function
    "D",        # docstrings
    "RUF",      # ruff's own checks
    "ERA",      # commented-out code
    "ARG",      # unused arguments
    "FBT",      # boolean positional arguments (flags that switch behaviour)
    "TID251",   # banned APIs (below)
]
ignore = [
    # Project docstring style: the summary may wrap onto the next lines and the closing quotes may follow the text.
    "D205", "D209", "D213", "D203", "D401",
    "D403",  # a docstring may start with a type or a code name: """int [z, y, x]: ...""", """argparse type: ..."""
    "D105", "D107",  # magic methods and __init__ are documented on the class
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A bare ndarray annotation passes mypy with numpy >= 2.3 (default type arguments) but fails with older numpy.
"numpy.ndarray".msg = "annotate arrays as numpy.typing.NDArray[...] (e.g. NDArray[np.bool_], NDArray[Any])"

[tool.ruff.lint.pylint]
max-args = 5
max-positional-args = 5

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
