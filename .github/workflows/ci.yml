name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run by hand from the Actions tab (any branch)

permissions:
  contents: read

concurrency:  # a new push to the same branch cancels the run still going for the old one
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false  # one OS or Python version failing still shows the result of the others
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]  # lowest supported (.python-version) and newest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: checks (${{ matrix.os }}, Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v7  # .gitattributes keeps LF line endings on Windows too
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint, format, types (pre-commit)
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Shell scripts parse (model step setup, Linux only)
        if: runner.os == 'Linux'
        run: bash -n scripts/setup_images_to_model.sh scripts/reproduce_images_to_model.sh
      - name: Tests (unit, integration, end-to-end, golden builds; the GPU test skips itself)
        run: python tests/run_all.py
